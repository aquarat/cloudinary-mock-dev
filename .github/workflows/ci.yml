name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only one run per branch/PR: a new push cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so CI is reproducible. Bump deliberately.
  BIOME_VERSION: 2.5.7

jobs:
  format:
    name: Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No `bun install` needed: bunx fetches the pinned Biome binary itself.
      - name: Check formatting
        run: bunx --bun @biomejs/biome@${{ env.BIOME_VERSION }} ci --reporter=github .

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        run: bun run typecheck

  test:
    name: Tests (bun test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun test
